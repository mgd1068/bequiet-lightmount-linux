# Named lamp zones for the Light Mount, resolved against
# docs/evidence/lamp_id_key_mapping.json. Edit freely - no code changes needed.
#
# A zone is either an explicit lamp_ids list, a lamp_range [start, end]
# (inclusive), a list of key names (resolved via the mapping file), or
# "all" minus a list of other zones to exclude.

zones:
  light_bar:
    lamp_range: [110, 132]

  m_keys:
    lamp_ids: [16, 17, 18, 19, 20]

  dial:
    lamp_ids: [109]

  wasd:
    keys: [W, A, S, D]

  nav_cluster:
    keys: [Insert, Home, PageUp, Delete, End, PageDown, UpArrow, LeftArrow, DownArrow, RightArrow]

  # Individual light bar segments, for status indicators that own a
  # single segment each (e.g. WireGuard tunnel state - see events.yaml's
  # `wireguard` section). Segment numbering here is 1-based/physical
  # (segment 1 = the first segment = LightBarSegment0/lamp 110).
  light_bar_segment_1:
    lamp_ids: [110]

  light_bar_segment_2:
    lamp_ids: [111]

  light_bar_segment_3:
    lamp_ids: [112]

  main_matrix:
    all_except: [light_bar, m_keys, dial, nav_cluster]
